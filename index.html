<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRC | Painel Mestre de Treinamento e Simulação</title>
<meta name="description" content="Simulador CRC de engenharia de rede, duplicação de GCom e blindagem contra VML.">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Chart.js + Plugin DataLabels -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<style>
/* RESET & LAYOUT RESPONSIVO */
*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
  overflow-x:hidden;
}

.app{
  position:relative;
  width:100%;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.overlay{
  position:absolute;
  inset:0;
  background: linear-gradient(to top, rgba(0,0,0,.95), rgba(0,0,0,.4));
}

/* CARD CONTAINER PRINCIPAL */
.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:960px;
  background: rgba(18, 24, 38, 0.94);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(0,255,136,.2);
  border-radius:20px;
  padding:20px;
  box-shadow: 0 12px 40px rgba(0,0,0,.5);
  display:flex;
  flex-direction:column;
  min-height:92vh;
}

.eyebrow{
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color: rgba(0,255,136,.85);
  margin-bottom:2px;
  font-weight: bold;
}

.title{
  font-size: clamp(16px,2vw,22px);
  line-height:1.2;
  margin-bottom:3px;
  font-weight:600;
}

.subtitle{
  font-size: clamp(11px,1vw,13px);
  line-height:1.3;
  color: rgba(255,255,255,.7);
  margin-bottom:12px;
}

/* SELECTS */
.sim-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.sim-label{
  display:block;
  font-size:11px;
  color:#aaa;
  margin-bottom:4px;
  text-align:left;
  line-height:1.2;
}

.sim-select{
  width:100%;
  background:#080808;
  border: 1px solid #222;
  border-radius:10px;
  padding:9px 11px;
  color:#00ff88;
  font-weight:bold;
  font-size:12px;
  outline:none;
}

/* CONTAINER EM 2 COLUNAS: TEXTO À ESQUERDA + GRÁFICO À DIREITA */
.sim-body-wrapper{
  display: flex;
  gap: 16px;
  align-items: stretch;
  flex: 1;
  min-height: 380px;
  margin-bottom: 12px;
}

/* QUADRADO DE TEXTO NA COLUNA ESQUERDA */
.info-col-left{
  width: 32%;
  min-width: 240px;
  background: rgba(0, 255, 136, 0.06);
  border: 1px dashed rgba(0, 255, 136, 0.4);
  border-radius: 14px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  box-shadow: inset 0 0 15px rgba(0, 255, 136, 0.03);
}

.info-col-left strong{
  display: block;
  font-size: 13px;
  color: #00ff88;
  margin-bottom: 8px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid rgba(0, 255, 136, 0.2);
  padding-bottom: 6px;
}

.info-col-left p{
  font-size: 11px;
  line-height: 1.5;
  color: #e2e8f0;
}

/* COLUNA DIREITA DO GRÁFICO DE BARRAS HORIZONTAIS */
.chart-col-right{
  flex: 1;
  position: relative;
  min-height: 340px;
  background: rgba(0,0,0,0.3);
  border-radius: 12px;
  padding: 8px;
  border: 1px solid rgba(255,255,255,0.05);
}

.retorno-scout{
  display:flex;
  justify-content:center;
  padding-top:10px;
  border-top:1px solid rgba(255,255,255,0.06);
  flex-shrink:0;
}

.retorno-scout a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  max-width:420px;
  min-height:40px;
  padding:8px 16px;
  border:1px solid rgba(0,255,136,.35);
  border-radius:10px;
  background:rgba(0,255,136,.08);
  color:#00ff88;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
}

/* ADAPTAÇÃO PARA TELAS MOBILE PEQUENAS */
@media(max-width:720px){
  .card{ padding:14px; min-height:96vh; }
  .sim-grid{ grid-template-columns:1fr; gap:6px; margin-bottom:8px; }
  .sim-body-wrapper{ flex-direction: column; gap: 10px; }
  .info-col-left{ width: 100%; min-width: 100%; padding: 12px; }
  .chart-col-right{ min-height: 340px; }
}
</style>
</head>

<body>

<div class="app">
  <div class="overlay"></div>

  <div class="card mx-auto">
    <div class="eyebrow">
      CRC | Painel Mestre de Treinamento de Gestores
    </div>

    <h1 class="title">
      Simulação Estratificada de Comunidade & Blindagem VML
    </h1>

    <p class="subtitle">
      Treinamento de equipes: Duplicação recorrente, expansão de linhas via SCOUT e aproveitamento máximo de bônus.
    </p>

    <!-- FILTROS DE MODOS -->
    <div class="sim-grid" id="simGrid">
      <div>
        <label class="sim-label">
          Novos Gestores (GCom) por Etapa
        </label>
        <select id="gestores" onchange="simular()" class="sim-select">
          <option value="2">2 Novos Gestores / Etapa (Modo Iniciante)</option>
          <option value="3" selected>3 Novos Gestores / Etapa (Modo Expansão CRC)</option>
          <option value="4">4 Novos Gestores / Etapa (Modo Executivo)</option>
        </select>
      </div>

      <div>
        <label class="sim-label">
          Consumo Recorrente Mensal por GCom
        </label>
        <select id="consumo" onchange="simular()" class="sim-select">
          <option value="300">R$ 300,00</option>
          <option value="450" selected>R$ 450,00 (Padrão Executivo - Recomendado)</option>
          <option value="500">R$ 500,00</option>
        </select>
      </div>
    </div>

    <!-- WRAPPER EM 2 COLUNAS: TEXTO À ESQUERDA E GRÁFICO À DIREITA -->
    <div class="sim-body-wrapper">
      <div class="info-col-left">
        <div id="infoContent"></div>
      </div>
      <div class="chart-col-right">
        <canvas id="meuGrafico"></canvas>
      </div>
    </div>

    <div class="retorno-scout">
      <a href="https://crc-scout.vercel.app/" target="_blank">
        Acessar Plataforma Principal SCOUT
        <span>→</span>
      </a>
    </div>
  </div>
</div>

<script>
Chart.register(ChartDataLabels);

let chartInstance = null;

const simulacaoOficial = {
  // Modo Executivo (4x450)
  "4_450": [
    { etapa: 1, gcom: 4, plano: "Executivo", total: 360.00 },
    { etapa: 2, gcom: 24, plano: "Ônix", total: 1186.00 },
    { etapa: 3, gcom: 108, plano: "Jaspe", total: 7038.00 },
    { etapa: 4, gcom: 448, plano: "Jade", total: 21240.00 },
    { etapa: 5, gcom: 1812, plano: "Dream Red", total: 68094.00 }
  ],
  // Modo Expansão (3x450)
  "3_450": [
    { etapa: 1, gcom: 3, plano: "Executivo", total: 270.00 },
    { etapa: 2, gcom: 15, plano: "Topázio", total: 634.50 },
    { etapa: 3, gcom: 54, plano: "Ametista", total: 3915.00 },
    { etapa: 4, gcom: 174, plano: "Diamante Negro", total: 13392.00 },
    { etapa: 5, gcom: 537, plano: "Jaspe", total: 41094.00 }
  ],
  // Modo Iniciante (2x450)
  "2_450": [
    { etapa: 1, gcom: 2, plano: "Executivo", total: 180.00 },
    { etapa: 2, gcom: 8, plano: "Topázio", total: 378.00 },
    { etapa: 3, gcom: 22, plano: "Ônix", total: 1310.00 },
    { etapa: 4, gcom: 52, plano: "Ametista", total: 2710.00 },
    { etapa: 5, gcom: 114, plano: "Diamante Negro", total: 6552.00 }
  ]
};

const textosExplicativos = {
  "2": "<strong>🌱 Modo Iniciante (2 Linhas)</strong><p>Ideal para novos líderes. Baixa complexidade de abertura de frentes, garantindo estabilidade e teste prático do consumo recorrente.</p>",
  "3": "<strong>🚀 Modo Expansão CRC (3 Linhas)</strong><p>A tese central da Matriz 3x3. Garante a simetria perfeita entre as frentes, diluindo o VML e atingindo patamares de Ametista e Diamante com folga.</p>",
  "4": "<strong>💼 Modo Executivo (4 Linhas)</strong><p>Alta performance de duplicação. Acelera os ganhos de Unilevel e PLR, exigindo maturidade na gestão de comunidade e acompanhamento contínuo.</p>"
};

function simular(){
  const d = parseInt(document.getElementById('gestores').value);
  const c = parseFloat(document.getElementById('consumo').value);

  const key = `${d}_${c}`;
  let dadosEtapas = [];

  if(simulacaoOficial[key]){
    dadosEtapas = simulacaoOficial[key];
  } else {
    let gcomAcum = 0;
    for(let e = 1; e <= 5; e++){
      let novos = Math.pow(d, e);
      gcomAcum += novos;
      
      let fator = (c / 450) * (d / 4);
      let baseTotal = 0;
      if(e === 1) baseTotal = 360 * fator;
      else if(e === 2) baseTotal = 1186 * fator;
      else if(e === 3) baseTotal = 7038 * fator;
      else if(e === 4) baseTotal = 21240 * fator;
      else if(e === 5) baseTotal = 68094 * fator;

      let planoNome = e === 1 ? "Executivo" : (e === 2 ? "Topázio" : (e === 3 ? "Jaspe" : (e === 4 ? "Jade" : "Dream Red")));

      dadosEtapas.push({
        etapa: e,
        gcom: gcomAcum,
        plano: planoNome,
        total: baseTotal
      });
    }
  }

  const labels = [];
  const valoresGanhos = [];
  const gcomsList = [];

  dadosEtapas.forEach(item => {
    labels.push(`${item.etapa}ª Etapa (${item.plano})`);
    valoresGanhos.push(item.total);
    gcomsList.push(item.gcom);
  });

  document.getElementById('infoContent').innerHTML = textosExplicativos[d.toString()] || "";

  renderizarGrafico(labels, valoresGanhos, gcomsList);
}

function renderizarGrafico(labels, dadosValores, dadosGcom) {
  const ctx = document.getElementById('meuGrafico').getContext('2d');
  
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Ganhos (R$)',
        data: dadosValores,
        backgroundColor: '#00ff88',
        borderRadius: 6,
        barThickness: 'flex',
        maxBarThickness: 32
      }]
    },
    options: {
      indexAxis: 'y', // <--- Transforma as barras em horizontais (perfeito para mobile)
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: { top: 10, left: 10, right: 75, bottom: 10 } // Espaço extra à direita para os números não cortarem
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true },
        datalabels: {
          anchor: 'end',
          align: 'end',
          color: '#00ff88',
          font: { weight: 'bold', size: 10 },
          formatter: function(value, context) {
            const index = context.dataIndex;
            const gcomCount = dadosGcom[index];
            const valorFormatado = 'R$ ' + value.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            return `${gcomCount} GCom | ${valorFormatado}`;
          }
        }
      },
      scales: {
        x: { 
          display: false, 
          grid: { display: false },
          suggestedMax: Math.max(...dadosValores) * 1.35 // Margem lateral garantida
        },
        y: {
          grid: { display: false },
          ticks: { color: '#ffffff', font: { size: 10, weight: 'bold' } }
        }
      }
    }
  });
}

window.onload = simular;
</script>

</body>
</html>
