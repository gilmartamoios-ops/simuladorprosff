<script>

/* SIMULADOR CRC */

function simular(){

const consumidoresBase =
parseInt(
document.getElementById(
'gestores'
).value
);

const consumo =
parseInt(
document.getElementById(
'consumo'
).value
);

/* UNILEVEL */

const percentuais = [

0.05,
0.05,
0.045,
0.04,
0.0275,
0.02,
0.005

];

/* NÍVEIS COMPLETOS */

const niveis = [

{
nome:'Empreendedor',
pontos:950,
pin:100
},

{
nome:'Senior',
pontos:2450,
pin:200
},

{
nome:'Expert',
pontos:7250,
pin:700
},

{
nome:'Enterprise',
pontos:14750,
pin:1300
},

{
nome:'Diamond',
pontos:27500,
pin:4000
},

{
nome:'Diamond Expert',
pontos:60000,
pin:12000
},

{
nome:'Diamond Global',
pontos:122500,
pin:24000
},

{
nome:'Empresarial Diamond',
pontos:247500,
pin:34000
},

{
nome:'Imperial Bonific',
pontos:495000,
pin:60000
},

{
nome:'Majestic Bonific',
pontos:1475000,
pin:130000
},

{
nome:'Presidencial',
pontos:3000000,
pin:250000
}

];

let html = '';

let camadas = [];

let consumidoresAtivos = 0;

let saldoPontos = 0;

let debitoMesSeguinte = 0;

/* SOMENTE 6 ETAPAS */

for(
let etapa = 1;
etapa <= 6;
etapa++
){

/* DÉBITO MÊS ANTERIOR */

saldoPontos -=
debitoMesSeguinte;

if(
saldoPontos < 0
){
saldoPontos = 0;
}

debitoMesSeguinte = 0;

/* DUPLICAÇÃO */

const novaCamada =

Math.pow(
consumidoresBase,
etapa
);

camadas.push(
novaCamada
);

consumidoresAtivos +=
novaCamada;

/* PONTOS DO MÊS */

const pontosMes =

novaCamada
*
(
consumo / 300
)
*
100;

/* 30D FLEXÍVEL */

let bonus30D = 0;

if(
etapa > 1
){

const pontosMesAnterior =

camadas[
etapa - 2
]
*
(
consumo / 300
)
*
100;

const metadeMesAnterior =

pontosMesAnterior
*
0.5;

if(
pontosMes >=
metadeMesAnterior
){

bonus30D =
pontosMesAnterior;

}

}

/* SALDO */

saldoPontos +=
pontosMes
+
bonus30D;

/* PIN */

let bonusPin = 0;

for(
let nivel of niveis
){

if(
saldoPontos >=
nivel.pontos
){

bonusPin =
nivel.pin;

debitoMesSeguinte =
nivel.pontos;

}

}

/* UNILEVEL */

let bonusUnilevel = 0;

camadas.forEach(
(
camada,
index
)=>{

if(
percentuais[index]
){

bonusUnilevel +=

(
camada
*
consumo
)
*
percentuais[index];

}

}
);

/* TOTAL */

const bonusEstimado =

bonusUnilevel
+
bonusPin;

/* IMAGEM */

const imagemComunidade =

`img/comunidade_${Math.min(
etapa,
6
)}.jpg`;

/* CARD */

html += `

"

">

${etapa}ª etapa

</div>
