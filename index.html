<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRC | Simulador Método Executivo</title>
<meta name="description" content="Simulador CRC de construção de comunidade e relacionamento de consumo baseado no Método Executivo.">

<!-- Tailwind CSS para estilização limpa -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Chart.js + Plugin de Rótulos de Dados (DataLabels) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<style>
/* RESET */
*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
  overflow:hidden;
}

/* APP */
.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background: linear-gradient(to top, rgba(0,0,0,.95), rgba(0,0,0,.4));
}

/* CARD CONTAINER PRINCIPAL */
.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:780px;
  background: rgba(18, 24, 38, 0.90);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  max-height:96vh;
  overflow:hidden;
}

/* TEXTO CABEÇALHO */
.eyebrow{
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color: rgba(0,255,136,.85);
  margin-bottom:4px;
  font-weight: bold;
}

.title{
  font-size: clamp(16px,2vw,22px);
  line-height:1.2;
  margin-bottom:4px;
  font-weight:600;
}

.subtitle{
  font-size: clamp(11px,1vw,13px);
  line-height:1.4;
  color: rgba(255,255,255,.7);
  margin-bottom:10px;
}

/* SIMULADOR FILTROS CLAROS PARA LEIGOS */
.sim-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.sim-label{
  display:block;
  font-size:11px;
  color:#aaa;
  margin-bottom:4px;
  text-align:left;
  line-height:1.3;
}

.sim-select{
  width:100%;
  background:#080808;
  border: 1px solid #222;
  border-radius:12px;
  padding:8px 12px;
  color:#00ff88;
  font-weight:bold;
  font-size:12px;
  outline:none;
}

/* CONTAINER DO GRÁFICO */
.chart-container{
  position:relative;
  width:100%;
  height:210px;
  margin-bottom:10px;
}

/* RESULTADO CONTAINER */
.resultado{
  flex:1;
  overflow-y:auto;
  padding-right:4px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.resultado::-webkit-scrollbar{ width:4px; }
.resultado::-webkit-scrollbar-thumb{ background:#222; border-radius:999px; }

/* CARD ETAPA COMPACTO */
.etapa-card{
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  border-radius:12px;
  padding:8px 12px;
  backdrop-filter: blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.etapa-info-left{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.etapa-num{
  font-size:11px;
  color:#00ff88;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight: bold;
}

.etapa-comunidades{
  font-size:13px;
  font-weight:600;
  color:#fff;
}

.etapa-valor{
  font-size:17px;
  font-weight:700;
  color:#00ff88;
  text-align:right;
}

/* RETORNO AO SCOUT */
.retorno-scout{
  display:flex;
  justify-content:center;
  padding-top:8px;
  margin-top:2px;
  flex-shrink:0;
}

.retorno-scout a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  max-width:420px;
  min-height:40px;
  padding:8px 16px;
  border:1px solid rgba(0,255,136,.35);
  border-radius:12px;
  background:rgba(0,255,136,.08);
  color:#00ff88;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  transition:all .2s ease;
}

.retorno-scout a:hover{
  background:rgba(0,255,136,.14);
  border-color:rgba(0,255,136,.65);
}

/* MOBILE RESPONSIVO */
@media(max-width:640px){
  .card{ padding:10px; max-height:98vh; }
  .sim-grid{ grid-template-columns:1fr; gap:6px; margin-bottom:6px; }
  .chart-container{ height:180px; }
  .etapa-card{ padding:6px 10px; }
  .etapa-comunidades{ font-size:12px; }
  .etapa-valor{ font-size:15px; }
}
</style>
</head>

<body>

<div class="app">
  <div class="overlay"></div>

  <div class="card mx-auto">
    <div class="eyebrow">
      CRC | Método Executivo Oficial
    </div>

    <h1 class="title">
      Simulação de Expansão da Comunidade
    </h1>

    <p class="subtitle">
      Projeção baseada na entrada de novos GCom e no consumo recorrente da rede.
    </p>

    <!-- FILTROS COM DESCRIÇÃO FACILITADA PARA LEIGOS -->
    <div class="sim-grid" id="simGrid">
      <div>
        <label class="sim-label">
          Novos GCom (Gestores de Comunidade) por etapa
        </label>
        <select id="gestores" onchange="simular()" class="sim-select">
          <option value="2">2 Novos Gestores / Etapa</option>
          <option value="3">3 Novos Gestores / Etapa</option>
          <option value="4" selected>4 Novos Gestores / Etapa (Método Executivo - Recomendado)</option>
          <option value="5">5 Novos Gestores / Etapa</option>
        </select>
      </div>

      <div>
        <label class="sim-label">
          Consumo Recorrente Mensal da Comunidade
        </label>
        <select id="consumo" onchange="simular()" class="sim-select">
          <option value="300">R$ 300,00</option>
          <option value="450" selected>R$ 450,00 (Método Executivo - Recomendado)</option>
          <option value="500">R$ 500,00</option>
        </select>
      </div>
    </div>

    <!-- GRÁFICO INTUITIVO COM NÚMEROS DE GCOM E BÔNUS NAS BARRAS -->
    <div class="chart-container">
      <canvas id="meuGrafico"></canvas>
    </div>

    <!-- LISTAGEM COMPLETA DOS RESULTADOS -->
    <div id="resultado" class="resultado"></div>

    <div class="retorno-scout">
      <a href="https://crc-scout.vercel.app/?etapa=quiz">
        Continuar no SCOUT
        <span>→</span>
      </a>
    </div>
  </div>
</div>

<script>
// Registra o plugin de rótulos diretos no Chart.js
Chart.register(ChartDataLabels);

let chartInstance = null;

// Matriz exata de equivalência da planilha oficial para o Método Executivo
const simulacaoOficial = {
  // Matriz Duplicação = 4 e Consumo = R$ 450,00 (Valores Exatos da Planilha)
  "4_450": [
    { etapa: 1, gcom: 4, plano: "Executivo", total: 360.00 },
    { etapa: 2, gcom: 24, plano: "Topázio", total: 936.00 },
    { etapa: 3, gcom: 108, plano: "Jaspe", total: 7038.00 },
    { etapa: 4, gcom: 448, plano: "Jade", total: 21240.00 },
    { etapa: 5, gcom: 1812, plano: "Dream Red", total: 68094.00 }
  ]
};

function simular(){
  const d = parseInt(document.getElementById('gestores').value);
  const c = parseFloat(document.getElementById('consumo').value);

  const key = `${d}_${c}`;
  let dadosEtapas = [];

  // Se for o parâmetro padrão da planilha oficial (4 x 450), usa a tabela exata
  if(simulacaoOficial[key]){
    dadosEtapas = simulacaoOficial[key];
  } else {
    // Algoritmo dinâmico de aproximação para outras variações
    let gcomAcum = 0;
    for(let e = 1; e <= 5; e++){
      let novos = Math.pow(d, e);
      gcomAcum += novos;
      
      // Proporcionalidade dinâmica de bonificação
      let fator = (c / 450) * (d / 4);
      let baseTotal = 0;
      if(e === 1) baseTotal = 360 * fator;
      else if(e === 2) baseTotal = 936 * fator;
      else if(e === 3) baseTotal = 7038 * fator;
      else if(e === 4) baseTotal = 21240 * fator;
      else if(e === 5) baseTotal = 68094 * fator;

      let planoNome = e === 1 ? "Executivo" : (e === 2 ? "Topázio" : (e === 3 ? "Jaspe" : (e === 4 ? "Jade" : "Dream Red")));

      dadosEtapas.push({
        etapa: e,
        gcom: gcomAcum,
        plano: planoNome,
        total: baseTotal
      });
    }
  }

  const labels = [];
  const valoresGanhos = [];
  const gcomsList = [];
  let html = '';

  dadosEtapas.forEach(item => {
    labels.push(`${item.etapa}ª Etapa (${item.plano})`);
    valoresGanhos.push(item.total);
    gcomsList.push(item.gcom);

    const numComunidades = Math.round(item.gcom / d);

    html += `
    <div class="etapa-card">
      <div class="etapa-info-left">
        <span class="etapa-num">${item.etapa}ª Etapa — ${item.plano}</span>
        <span class="etapa-comunidades">${numComunidades} comunidades (${item.gcom.toLocaleString('pt-BR')} GCom)</span>
      </div>
      <div class="etapa-valor">
        R$ ${item.total.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
      </div>
    </div>
    `;
  });

  document.getElementById('resultado').innerHTML = html;
  renderizarGrafico(labels, valoresGanhos, gcomsList);
}

function renderizarGrafico(labels, dadosValores, dadosGcom) {
  const ctx = document.getElementById('meuGrafico').getContext('2d');
  
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Ganhos (R$)',
        data: dadosValores,
        backgroundColor: '#00ff88',
        borderRadius: 6,
        barThickness: 'flex'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: { top: 25 }
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true },
        // RÓTULOS DIRETOS NAS BARRAS PARA INTUIÇÃO COGNITIVA IMEDIATA DO LEAD
        datalabels: {
          anchor: 'end',
          align: 'end',
          offset: 2,
          color: '#00ff88',
          font: { weight: 'bold', size: 10 },
          formatter: function(value, context) {
            const index = context.dataIndex;
            const gcomCount = dadosGcom[index];
            const valorFormatado = 'R$ ' + value.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            return `${gcomCount} GCom\n${valorFormatado}`;
          },
          textAlign: 'center'
        }
      },
      scales: {
        y: { display: false, grid: { display: false } },
        x: {
          grid: { display: false },
          ticks: { color: '#ffffff', font: { size: 10, weight: 'bold' } }
        }
      }
    }
  });
}

// Inicializa o simulador ao carregar a página
window.onload = simular;
</script>

</body>
</html>
