<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRC | Painel Mestre de Alocação e VML</title>
<meta name="description" content="Engenharia de rede CRC: Mapeamento individual de consumo por linha e blindagem de VML.">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
*{ margin:0; padding:0; box-sizing:border-box; }
html, body{ width:100%; height:100%; font-family:Arial,sans-serif; background:#050706; color:white; overflow-x:hidden; }
.app{ width:100%; min-height:100dvh; padding:20px; display:flex; justify-content:center; }
.container-master{ width:100%; max-width:1400px; }

/* HEADER E SELETORES IDENTICOS AO SCOUT */
.header-box{ background: rgba(18, 24, 38, 0.95); border: 1px solid rgba(0,255,136,.3); border-radius:16px; padding:20px; margin-bottom:20px; }
.eyebrow{ font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color: #00ff88; font-weight: bold; margin-bottom:4px; }
.title{ font-size: clamp(18px, 2.5vw, 24px); font-weight:700; margin-bottom:4px; }
.subtitle{ font-size: 13px; color: #94a3b8; margin-bottom:16px; }

/* ESTILIZAÇÃO PADRÃO DAS CAIXAS DE SELEÇÃO (SCOUT) */
.sim-grid{ display:grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap:12px; background: rgba(0,0,0,0.5); padding:14px; border-radius:12px; border: 1px solid rgba(255,255,255,0.08); }
.sim-label{ display:block; font-size:11px; color:#aaa; margin-bottom:6px; text-transform:uppercase; font-weight:bold; letter-spacing:0.5px; }
.sim-select{ 
  width:100%; 
  background:#080808; 
  border: 1px solid #222; 
  border-radius:10px; 
  padding:10px 12px; 
  color:#00ff88; 
  font-weight:bold; 
  font-size:13px; 
  outline:none;
  cursor:pointer;
  transition: border-color 0.2s;
}
.sim-select:hover{ border-color: #00ff88; }

/* CARDS DAS ETAPAS */
.etapa-card{ background: #0b110e; border: 1px solid rgba(255,255,255,0.08); border-radius:14px; padding:18px; margin-bottom:16px; }
.etapa-card:hover{ border-color: rgba(0,255,136,0.4); }
.etapa-header{ display:flex; justify-content:space-between; align-items:center; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom:12px; margin-bottom:14px; flex-wrap:wrap; gap:10px; }

/* GRID INDIVIDUAL DE LINHAS */
.linhas-grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(185px, 1fr)); gap:10px; }
.linha-item{ background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.05); border-radius:8px; padding:10px 12px; display:flex; flex-direction:column; justify-content:space-between; }
.linha-item.antiga{ border-left: 3px solid #00ff88; }
.linha-item.nova{ border-left: 3px solid #38bdf8; }
.linha-tag{ font-size:11px; font-weight:bold; color:#94a3b8; display:flex; justify-content:space-between; }
.linha-tag span{ color:#00ff88; }
.linha-val{ font-size:14px; font-weight:bold; color:#ffffff; font-family:monospace; margin-top:4px; }
</style>
</head>

<body>

<div class="app">
  <div class="container-master">
    
    <div class="header-box">
      <div class="eyebrow">CRC | PAINEL DE ALOCAÇÃO DE EQUIPES & DIAGNÓSTICO DE VML</div>
      <h1 class="title">Mapa Aritmético Individual por Linha</h1>
      <p class="subtitle">Identifique exatamente a produção de cada linha para saber onde direcionar novos cadastros do SCOUT.</p>

      <!-- CAIXAS DE DIÁLOGO / SELETORES PADRÃO SCOUT -->
      <div class="sim-grid">
        <div>
          <label class="sim-label">Novas Linhas por Etapa</label>
          <select id="gestores" onchange="calcularEExibir()" class="sim-select">
            <option value="2">2 Novos Gestores / Etapa (Modo Iniciante)</option>
            <option value="3" selected>3 Novos Gestores / Etapa (Modo Expansão CRC)</option>
            <option value="4">4 Novos Gestores / Etapa (Modo Executivo)</option>
          </select>
        </div>
        <div>
          <label class="sim-label">Consumo Recorrente Mensal da Comunidade</label>
          <select id="consumo" onchange="calcularEExibir()" class="sim-select">
            <option value="300">R$ 300,00</option>
            <option value="450">R$ 450,00 (Padrão Executivo - Recomendado)</option>
            <option value="500" selected>R$ 500,00</option>
          </select>
        </div>
      </div>
    </div>

    <!-- ÁREA DAS ETAPAS -->
    <div id="etapasContainer"></div>

  </div>
</div>

<script>
const carreirasMap3x3 = [
  "Executivo", "Topázio", "Diamante (Ametista)", "Jaspe", "Jade", 
  "Royal Black", "Dream Red", "Master Gold", "Master Gold", "Master Gold (Topo)"
];

const carreirasMap4x4 = [
  "Executivo", "Ônix", "Jaspe", "Jade", "Dream Red", 
  "Royal Black", "Master Gold", "Master Gold", "Master Gold", "Master Gold (Topo)"
];

// Mapeamento Exato da Coluna BL (GCom Total) da sua Planilha Oficial
const gcomsOficiais_4x = [4, 24, 108, 448, 1812, 7272, 29116, 116496, 466020, 815544];
const gcomsOficiais_3x = [3, 15, 54, 174, 537, 1629, 4908, 14748, 44271, 73794];
const gcomsOficiais_2x = [2, 8, 22, 52, 114, 240, 500, 1020, 2080, 4200];

function calcularEExibir() {
  const d = parseInt(document.getElementById('gestores').value);
  const c = parseFloat(document.getElementById('consumo').value);
  const container = document.getElementById('etapasContainer');
  container.innerHTML = '';

  const carreiras = d === 4 ? carreirasMap4x4 : carreirasMap3x3;
  const listaGcomsBase = d === 4 ? gcomsOficiais_4x : (d === 3 ? gcomsOficiais_3x : gcomsOficiais_2x);

  for (let e = 1; e <= 10; e++) {
    const totalLinhasEtapa = e * d;
    const gcomTotalEtapa = listaGcomsBase[e - 1];
    
    // Total Oficial da Célula BO da Planilha: GCom Total x Consumo Unitário
    const totalConsumoEtapaOficial = gcomTotalEtapa * c;

    // Cálculo das profundidades e pesos geométricos de cada linha
    let pesosLinhas = [];
    let somaPesos = 0;

    for (let l = 1; l <= totalLinhasEtapa; l++) {
      const etapaAbertura = Math.floor((l - 1) / d) + 1;
      const profundidade = (e - etapaAbertura) + 1;
      const peso = Math.pow(d, profundidade);
      pesosLinhas.push({ linha: l, profundidade: profundidade, peso: peso, etapaAbertura: etapaAbertura });
      somaPesos += peso;
    }

    let htmlLinhas = '';
    let somaVerificacao = 0;

    pesosLinhas.forEach((item, idx) => {
      let volumeLinha = 0;
      if (idx === pesosLinhas.length - 1) {
        // Ajuste de fechamento exato para bater 100% com o total da etapa sem arredondamentos incorretos
        volumeLinha = totalConsumoEtapaOficial - somaVerificacao;
      } else {
        volumeLinha = Math.round(totalConsumoEtapaOficial * (item.peso / somaPesos));
        somaVerificacao += volumeLinha;
      }

      const classeEstilo = item.etapaAbertura === 1 ? 'antiga' : 'nova';

      htmlLinhas += `
        <div class="linha-item ${classeEstilo}">
          <div class="linha-tag">
            Linha ${item.linha}
            <span>P: ${item.profundidade} Nív</span>
          </div>
          <div class="linha-val">R$ ${volumeLinha.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</div>
        </div>
      `;
    });

    const cardHtml = `
      <div class="etapa-card">
        <div class="etapa-header">
          <div>
            <span style="color:#00ff88; font-weight:bold; font-size:16px;">Etapa ${e}</span>
            <span style="background:rgba(0,255,136,0.1); color:#00ff88; border:1px solid rgba(0,255,136,0.3); padding:3px 10px; border-radius:12px; font-size:11px; margin-left:10px; font-weight:bold;">
              ${carreiras[e-1]}
            </span>
            <span style="color:#aaa; font-size:12px; margin-left:12px;">
              (${gcomTotalEtapa.toLocaleString('pt-BR')} GComs Totais)
            </span>
          </div>
          <div style="text-align:right;">
            <span style="color:#aaa; font-size:12px;">Total Oficial da Etapa (${totalLinhasEtapa} Linhas):</span>
            <strong style="color:#00ff88; font-size:18px; font-family:monospace; margin-left:8px;">
              R$ ${totalConsumoEtapaOficial.toLocaleString('pt-BR', {minimumFractionDigits: 2})}
            </strong>
          </div>
        </div>

        <div style="font-size:11px; color:#aaa; margin-bottom:10px; font-weight:600; text-transform:uppercase;">
          Detalhamento Individual de Volume por Linha:
        </div>

        <div class="linhas-grid">
          ${htmlLinhas}
        </div>
      </div>
    `;

    container.innerHTML += cardHtml;
  }
}

window.onload = calcularEExibir;
</script>

</body>
</html>
