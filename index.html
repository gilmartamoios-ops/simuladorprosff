<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRC | Simulador Método Executivo</title>
<meta name="description" content="Simulador CRC de construção de comunidade e relacionamento de consumo baseado no Método Executivo.">

<!-- Tailwind CSS para estruturação moderna -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Chart.js para renderização de gráficos limpos e de alto impacto cognitivo -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* RESET */
*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
  overflow:hidden;
}

/* APP */
.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background: linear-gradient(to top, rgba(0,0,0,.95), rgba(0,0,0,.4));
}

/* CARD CONTAINER PRINCIPAL */
.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:760px;
  background: rgba(18, 24, 38, 0.85);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  max-height:96vh;
  overflow:hidden;
}

/* TEXTO CABEÇALHO */
.eyebrow{
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color: rgba(0,255,136,.8);
  margin-bottom:4px;
  font-weight: bold;
}

.title{
  font-size: clamp(16px,2vw,22px);
  line-height:1.2;
  margin-bottom:4px;
  font-weight:600;
}

.subtitle{
  font-size: clamp(11px,1vw,13px);
  line-height:1.4;
  color: rgba(255,255,255,.7);
  margin-bottom:10px;
}

/* SIMULADOR FILTROS */
.sim-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:10px;
}

.sim-label{
  display:block;
  font-size:11px;
  color:#aaa;
  margin-bottom:4px;
  text-align:left;
  line-height:1.3;
}

.sim-select{
  width:100%;
  background:#080808;
  border: 1px solid #222;
  border-radius:12px;
  padding:8px 12px;
  color:#00ff88;
  font-weight:bold;
  font-size:13px;
  outline:none;
}

/* CONTAINER DO GRÁFICO LIMPO */
.chart-container{
  position:relative;
  width:100%;
  height:180px;
  margin-bottom:10px;
}

/* RESULTADO CONTAINER */
.resultado{
  flex:1;
  overflow-y:auto;
  padding-right:4px;
  display:flex;
  flex-direction:column;
  gap:6px;
}

.resultado::-webkit-scrollbar{ width:4px; }
.resultado::-webkit-scrollbar-thumb{ background:#222; border-radius:999px; }

/* CARD ETAPA COMPACTO */
.etapa-card{
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  border-radius:12px;
  padding:8px 12px;
  backdrop-filter: blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.etapa-info-left{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.etapa-num{
  font-size:11px;
  color:#00ff88;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight: bold;
}

.etapa-comunidades{
  font-size:13px;
  font-weight:600;
  color:#fff;
}

.etapa-qualificacao{
  font-size:11px;
  color:#8c8c8c;
}

.etapa-valor{
  font-size:17px;
  font-weight:700;
  color:#00ff88;
  text-align:right;
}

/* RETORNO AO SCOUT */
.retorno-scout{
  display:flex;
  justify-content:center;
  padding-top:8px;
  margin-top:2px;
  flex-shrink:0;
}

.retorno-scout a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  max-width:420px;
  min-height:40px;
  padding:8px 16px;
  border:1px solid rgba(0,255,136,.35);
  border-radius:12px;
  background:rgba(0,255,136,.08);
  color:#00ff88;
  text-decoration:none;
  font-size:13px;
  font-weight:700;
  transition:all .2s ease;
}

.retorno-scout a:hover{
  background:rgba(0,255,136,.14);
  border-color:rgba(0,255,136,.65);
}

/* MOBILE RESPONSIVO */
@media(max-width:640px){
  .card{ padding:10px; max-height:98vh; }
  .sim-grid{ grid-template-columns:1fr; gap:6px; margin-bottom:6px; }
  .chart-container{ height:150px; }
  .etapa-card{ padding:6px 10px; }
  .etapa-comunidades{ font-size:12px; }
  .etapa-valor{ font-size:15px; }
}
</style>
</head>

<body>

<div class="app">
  <div class="overlay"></div>

  <div class="card mx-auto">
    <div class="eyebrow">
      CRC | Método Executivo Oficial
    </div>

    <h1 class="title">
      Simulação de Expansão da Comunidade
    </h1>

    <p class="subtitle">
      Projeção baseada em GCom - gestores de comunidade e consumo recorrente.
    </p>

    <!-- FILTROS DE ENTRADA -->
    <div class="sim-grid" id="simGrid">
      <div>
        <label class="sim-label">
          GCom - gestores de comunidade (por núcleo)
        </label>
        <select id="gestores" onchange="simular()" class="sim-select">
          <option value="3">3 Gestores (Livre)</option>
          <option value="4" selected>4 Gestores (Método Executivo - Recomendado)</option>
          <option value="5">5 Gestores (Acelerado)</option>
        </select>
      </div>

      <div>
        <label class="sim-label">
          consumo recorrente mensal
        </label>
        <select id="consumo" onchange="simular()" class="sim-select">
          <option value="300">R$ 300,00</option>
          <option value="450" selected>R$ 450,00 (Padrão Executivo)</option>
          <option value="500">R$ 500,00</option>
        </select>
      </div>
    </div>

    <!-- GRÁFICO LIMPO (SEM POLUIÇÃO DE EIXOS OU LINHAS) -->
    <div class="chart-container">
      <canvas id="meuGrafico"></canvas>
    </div>

    <!-- LISTAGEM DETALHADA POR ETAPA -->
    <div id="resultado" class="resultado"></div>

    <div class="retorno-scout">
      <a href="https://crc-scout.vercel.app/?etapa=quiz">
        Continuar no SCOUT
        <span>→</span>
      </a>
    </div>
  </div>
</div>

<script>
let chartInstance = null;

const carreira = [
  { nome: 'Executivo', pts: 0, plr: 0 },
  { nome: 'Topázio', pts: 2000, plr: 0 },
  { nome: 'Ônix', pts: 10000, plr: 0 },
  { nome: 'Ametista', pts: 20000, plr: 0 },
  { nome: 'Diamante Negro', pts: 35000, plr: 0.06 },
  { nome: 'Jaspe', pts: 70000, plr: 0.05 },
  { nome: 'Jade', pts: 140000, plr: 0.04 },
  { nome: 'Royal Black', pts: 300000, plr: 0.04 },
  { nome: 'Dream Red', pts: 750000, plr: 0.03 },
  { nome: 'Master Gold', pts: 2000000, plr: 0.02 }
];

function simular(){
  const gcomPorNucleo = parseInt(document.getElementById('gestores').value);
  const consumoRecorrente = parseFloat(document.getElementById('consumo').value);

  const labels = [];
  const valoresGanhos = [];
  let html = '';
  let camadas = [];
  let pessoasAtivas = 0;

  for(let etapa = 1; etapa <= 5; etapa++){
    const novaCamadaPessoas = Math.pow(gcomPorNucleo, etapa);
    camadas.push(novaCamadaPessoas);
    pessoasAtivas += novaCamadaPessoas;

    const numeroComunidades = pessoasAtivas / gcomPorNucleo;

    // Faturamento e Pontos
    const faturamAtiv = novaCamadaPessoas * consumoRecorrente;
    let faturamRecompra = 0;
    for(let i = 1; i < etapa; i++){
      faturamRecompra += Math.pow(gcomPorNucleo, i) * consumoRecorrente;
    }
    const pontosTotais = faturamAtiv + faturamRecompra;

    // Qualificação
    let qualif = 'Executivo';
    let plrPerc = 0;
    for(let c of carreira){
      if(pontosTotais >= c.pts){
        qualif = c.nome;
        plrPerc = c.plr;
      }
    }

    // Bônus Unilevel
    const percAtiv = [0.20, 0.05, 0.05, 0.05, 0.05];
    const percCons = [0.12, 0.08, 0.08, 0.04, 0.04, 0.04, 0.06, 0.06, 0.08];

    let bAtiv = etapa <= 5 ? (novaCamadaPessoas * consumoRecorrente) * percAtiv[etapa - 1] : 0;
    let bCons = 0;
    for(let i = 1; i < etapa; i++){
      bCons += (Math.pow(gcomPorNucleo, i) * consumoRecorrente) * percCons[i - 1];
    }

    let bPLR = pontosTotais * plrPerc;
    let bEvolution = (qualif === 'Ônix') ? 250 : (qualif === 'Ametista' ? 500 : 0);

    const totalGanho = bAtiv + bCons + bPLR + bEvolution;

    labels.push(`${etapa}ª Etapa\n(${qualif})`);
    valoresGanhos.push(totalGanho);

    html += `
    <div class="etapa-card">
      <div class="etapa-info-left">
        <span class="etapa-num">${etapa}ª Etapa — ${qualif}</span>
        <span class="etapa-comunidades">${Math.round(numeroComunidades).toLocaleString('pt-BR')} comunidades (${pessoasAtivas.toLocaleString('pt-BR')} GCom)</span>
      </div>
      <div class="etapa-valor">
        R$ ${totalGanho.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
      </div>
    </div>
    `;
  }

  document.getElementById('resultado').innerHTML = html;
  renderizarGrafico(labels, valoresGanhos);
}

function renderizarGrafico(labels, dados) {
  const ctx = document.getElementById('meuGrafico').getContext('2d');
  
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Ganhos Estimados (R$)',
        data: dados,
        backgroundColor: '#00ff88',
        borderRadius: 6,
        barThickness: 'flex'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { display: false },
        tooltip: {
          callbacks: {
            label: function(context) {
              return ' Ganhos: R$ ' + context.raw.toLocaleString('pt-BR', {minimumFractionDigits: 2});
            }
          }
        }
      },
      scales: {
        // Eixos completamente limpos sem poluição visual
        y: { display: false, grid: { display: false } },
        x: {
          grid: { display: false },
          ticks: { color: '#ffffff', font: { size: 10, weight: 'bold' } }
        }
      }
    }
  });
}

// Inicializa a simulação ao carregar
window.onload = simular;
</script>

</body>
</html>
