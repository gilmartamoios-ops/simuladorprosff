<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRC | Simulador de Comunidades</title>
<meta name="description" content="Simulador CRC de construção de comunidade e relacionamento de consumo.">

<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Chart.js + Plugin DataLabels -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0"></script>

<style>
/* RESET & LAYOUT RESPONSIVO */
*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
  overflow-x:hidden;
}

.app{
  position:relative;
  width:100%;
  min-height:100dvh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
}

.overlay{
  position:absolute;
  inset:0;
  background: linear-gradient(to top, rgba(0,0,0,.95), rgba(0,0,0,.4));
}

/* CARD CONTAINER PRINCIPAL */
.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:820px;
  background: rgba(18, 24, 38, 0.92);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius:20px;
  padding:16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  min-height:94vh;
}

.eyebrow{
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
  color: rgba(0,255,136,.85);
  margin-bottom:2px;
  font-weight: bold;
}

.title{
  font-size: clamp(15px,2vw,20px);
  line-height:1.2;
  margin-bottom:3px;
  font-weight:600;
}

.subtitle{
  font-size: clamp(11px,1vw,12px);
  line-height:1.3;
  color: rgba(255,255,255,.7);
  margin-bottom:10px;
}

/* SELECTS */
.sim-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:8px;
}

.sim-label{
  display:block;
  font-size:10px;
  color:#aaa;
  margin-bottom:3px;
  text-align:left;
  line-height:1.2;
}

.sim-select{
  width:100%;
  background:#080808;
  border: 1px solid #222;
  border-radius:10px;
  padding:8px 10px;
  color:#00ff88;
  font-weight:bold;
  font-size:11px;
  outline:none;
}

/* CARD EXPLICATIVO EM DESTAQUE - NO TOPO ANTES DO GRÁFICO */
.info-card-top{
  background: rgba(0, 255, 136, 0.08);
  border: 1px solid rgba(0, 255, 136, 0.35);
  border-left: 4px solid #00ff88;
  border-radius: 10px;
  padding: 10px 12px;
  margin-bottom: 10px;
  font-size: 11px;
  line-height: 1.4;
  color: #f1f5f9;
  box-shadow: 0 4px 15px rgba(0,255,136,0.05);
}

.info-card-top strong{
  color: #00ff88;
  font-size: 12px;
}

/* ÁREA DO GRÁFICO EXPANDIDO */
.chart-container{
  position:relative;
  width:100%;
  flex:1;
  min-height:210px;
  margin-bottom:8px;
}

.retorno-scout{
  display:flex;
  justify-content:center;
  padding-top:8px;
  border-top:1px solid rgba(255,255,255,0.06);
  flex-shrink:0;
}

.retorno-scout a{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  width:100%;
  max-width:420px;
  min-height:38px;
  padding:8px 14px;
  border:1px solid rgba(0,255,136,.35);
  border-radius:10px;
  background:rgba(0,255,136,.08);
  color:#00ff88;
  text-decoration:none;
  font-size:12px;
  font-weight:700;
}

/* MOBILE RESPONSIVO */
@media(max-width:640px){
  .app{ padding:4px; }
  .card{ padding:12px; min-height:96vh; }
  .sim-grid{ grid-template-columns:1fr; gap:6px; margin-bottom:6px; }
  .sim-select{ font-size:11px; padding:7px 9px; }
  .info-card-top{ font-size: 10px; padding: 8px 10px; }
  .chart-container{ min-height:180px; }
}
</style>
</head>

<body>

<div class="app">
  <div class="overlay"></div>

  <div class="card mx-auto">
    <div class="eyebrow">
      CRC | Modelo de Comunidades
    </div>

    <h1 class="title">
      Simulação de Expansão da Comunidade
    </h1>

    <p class="subtitle">
      Projeção baseada em GCom - gestores de comunidade e consumo recorrente.
    </p>

    <!-- FILTROS COM OS 3 MODELOS -->
    <div class="sim-grid" id="simGrid">
      <div>
        <label class="sim-label">
          Novos GCom (Gestores de Comunidade) por etapa
        </label>
        <select id="gestores" onchange="simular()" class="sim-select">
          <option value="2">2 Novos Gestores / Etapa (Modo Iniciante)</option>
          <option value="3">3 Novos Gestores / Etapa (Modo Expansão)</option>
          <option value="4" selected>4 Novos Gestores / Etapa (Modo Executivo)</option>
        </select>
      </div>

      <div>
        <label class="sim-label">
          Consumo Recorrente Mensal da Comunidade
        </label>
        <select id="consumo" onchange="simular()" class="sim-select">
          <option value="300">R$ 300,00</option>
          <option value="450" selected>R$ 450,00 (Padrão Executivo - Recomendado)</option>
          <option value="500">R$ 500,00</option>
        </select>
      </div>
    </div>

    <!-- CONTEÚDO EXPLICATIVO EM DESTAQUE NO TOPO (LOGO ABAIXO DOS SELECTS) -->
    <div id="infoCardTop" class="info-card-top"></div>

    <!-- GRÁFICO EXPANDIDO -->
    <div class="chart-container">
      <canvas id="meuGrafico"></canvas>
    </div>

    <div class="retorno-scout">
      <a href="https://crc-scout.vercel.app/?etapa=quiz">
        Continuar no SCOUT
        <span>→</span>
      </a>
    </div>
  </div>
</div>

<script>
Chart.register(ChartDataLabels);

let chartInstance = null;

// Tabela Oficial com Bônus Evolution (R$ 250) Incluído no Modo Executivo (R$ 1.186,00 na 2ª Etapa)
const simulacaoOficial = {
  // Modo Executivo (4x450)
  "4_450": [
    { etapa: 1, gcom: 4, plano: "Executivo", total: 360.00 },
    { etapa: 2, gcom: 24, plano: "Ônix", total: 1186.00 },
    { etapa: 3, gcom: 108, plano: "Jaspe", total: 7038.00 },
    { etapa: 4, gcom: 448, plano: "Jade", total: 21240.00 },
    { etapa: 5, gcom: 1812, plano: "Dream Red", total: 68094.00 }
  ],
  // Modo Expansão (3x450)
  "3_450": [
    { etapa: 1, gcom: 3, plano: "Executivo", total: 270.00 },
    { etapa: 2, gcom: 15, plano: "Topázio", total: 634.50 },
    { etapa: 3, gcom: 54, plano: "Ametista", total: 3915.00 },
    { etapa: 4, gcom: 174, plano: "Diamante Negro", total: 13392.00 },
    { etapa: 5, gcom: 537, plano: "Jaspe", total: 41094.00 }
  ],
  // Modo Iniciante (2x450)
  "2_450": [
    { etapa: 1, gcom: 2, plano: "Executivo", total: 180.00 },
    { etapa: 2, gcom: 8, plano: "Topázio", total: 378.00 },
    { etapa: 3, gcom: 22, plano: "Ônix", total: 1310.00 },
    { etapa: 4, gcom: 52, plano: "Ametista", total: 2710.00 },
    { etapa: 5, gcom: 114, plano: "Diamante Negro", total: 6552.00 }
  ]
};

const textosExplicativos = {
  "2": "🌱 <strong>Estratégia do Modo Iniciante (2 Gestores):</strong> Alta facilidade de duplicação. A partir da 3ª etapa, o bônus cobre integralmente as parcelas do cartão da compra inicial e gera lucro líquido crescente, garantindo auto-sustentabilidade imediata.",
  "3": "🚀 <strong>Estratégia do Modo Expansão (3 Gestores):</strong> Equilíbrio ideal entre duplicação e velocidade. Acelera os ganhos do Unilevel e coloca o gestor na faixa de R$ 3.900 a R$ 13.000 já entre a 3ª e 4ª etapa.",
  "4": "💼 <strong>Estratégia do Modo Executivo (4 Gestores):</strong> O padrão profissional de máxima performance. Otimiza o Volume Máximo por Linha (VML), garante o Bônus Evolution e PLR acelerados, atingindo graduações de elite (Jaspe e Jade) com menor profundidade de rede."
};

function simular(){
  const d = parseInt(document.getElementById('gestores').value);
  const c = parseFloat(document.getElementById('consumo').value);

  const key = `${d}_${c}`;
  let dadosEtapas = [];

  if(simulacaoOficial[key]){
    dadosEtapas = simulacaoOficial[key];
  } else {
    let gcomAcum = 0;
    for(let e = 1; e <= 5; e++){
      let novos = Math.pow(d, e);
      gcomAcum += novos;
      
      let fator = (c / 450) * (d / 4);
      let baseTotal = 0;
      if(e === 1) baseTotal = 360 * fator;
      else if(e === 2) baseTotal = 1186 * fator;
      else if(e === 3) baseTotal = 7038 * fator;
      else if(e === 4) baseTotal = 21240 * fator;
      else if(e === 5) baseTotal = 68094 * fator;

      let planoNome = e === 1 ? "Executivo" : (e === 2 ? "Topázio" : (e === 3 ? "Jaspe" : (e === 4 ? "Jade" : "Dream Red")));

      dadosEtapas.push({
        etapa: e,
        gcom: gcomAcum,
        plano: planoNome,
        total: baseTotal
      });
    }
  }

  const labels = [];
  const valoresGanhos = [];
  const gcomsList = [];

  dadosEtapas.forEach(item => {
    labels.push(`${item.etapa}ª Etapa\n(${item.plano})`);
    valoresGanhos.push(item.total);
    gcomsList.push(item.gcom);
  });

  // Insere a explicação no topo (antes do gráfico)
  document.getElementById('infoCardTop').innerHTML = textosExplicativos[d.toString()] || "";

  renderizarGrafico(labels, valoresGanhos, gcomsList);
}

function renderizarGrafico(labels, dadosValores, dadosGcom) {
  const ctx = document.getElementById('meuGrafico').getContext('2d');
  
  if (chartInstance) chartInstance.destroy();

  chartInstance = new Chart(ctx, {
    type: 'bar',
    data: {
      labels: labels,
      datasets: [{
        label: 'Ganhos (R$)',
        data: dadosValores,
        backgroundColor: '#00ff88',
        borderRadius: 6,
        barThickness: 'flex'
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      layout: {
        padding: { top: 38, left: 5, right: 5, bottom: 5 }
      },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: true },
        datalabels: {
          anchor: 'end',
          align: 'end',
          offset: 2,
          color: '#00ff88',
          font: { weight: 'bold', size: 10 },
          formatter: function(value, context) {
            const index = context.dataIndex;
            const gcomCount = dadosGcom[index];
            const valorFormatado = 'R$ ' + value.toLocaleString('pt-BR', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            return `${gcomCount} GCom\n${valorFormatado}`;
          },
          textAlign: 'center'
        }
      },
      scales: {
        y: { display: false, grid: { display: false } },
        x: {
          grid: { display: false },
          ticks: { color: '#ffffff', font: { size: 10, weight: 'bold' } }
        }
      }
    }
  });
}

window.onload = simular;
</script>

</body>
</html>
