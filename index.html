<!DOCTYPE html>
<html lang="pt-br">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRC | Simulador de Comunidade</title>
<meta name="description" content="Simulador CRC de construção de comunidade e relacionamento de consumo.">

<script src="https://cdn.tailwindcss.com"></script>

<style>
/* RESET */
*{ margin:0; padding:0; box-sizing:border-box; }

html, body{
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#050505;
  color:white;
  overflow:hidden;
}

/* APP */
.app{
  position:relative;
  width:100%;
  height:100dvh;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:10px;
}

/* OVERLAY */
.overlay{
  position:absolute;
  inset:0;
  background: linear-gradient(to top, rgba(0,0,0,.95), rgba(0,0,0,.4));
}

/* CARD CONTAINER PRINCIPAL */
.card{
  position:relative;
  z-index:2;
  width:100%;
  max-width:760px;
  background: rgba(0,0,0,.25);
  backdrop-filter: blur(16px);
  border: 1px solid rgba(255,255,255,.08);
  border-radius:24px;
  padding:16px;
  box-shadow: 0 12px 40px rgba(0,0,0,.35);
  display:flex;
  flex-direction:column;
  max-height:96vh;
  overflow:hidden;
}

/* TEXTO CABEÇALHO */
.eyebrow{
  font-size:11px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color: rgba(255,255,255,.64);
  margin-bottom:4px;
}

.title{
  font-size: clamp(16px,2vw,24px);
  line-height:1.2;
  margin-bottom:4px;
  font-weight:600;
}

.subtitle{
  font-size: clamp(11px,1vw,13px);
  line-height:1.4;
  color: rgba(255,255,255,.7);
  margin-bottom:12px;
}

/* SIMULADOR FILTROS */
.sim-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:12px;
}

.sim-label{
  display:block;
  font-size:11px;
  color:#aaa;
  margin-bottom:4px;
  text-align:left;
  line-height:1.3;
}

.sim-select{
  width:100%;
  background:#080808;
  border: 1px solid #222;
  border-radius:12px;
  padding:8px 12px;
  color:#00ff88;
  font-weight:bold;
  font-size:14px;
  outline:none;
}

/* RESULTADO CONTAINER */
.resultado{
  flex:1;
  overflow-y:auto;
  padding-right:4px;
  display:flex;
  flex-direction:column;
  gap:8px;
}

.resultado::-webkit-scrollbar{ width:4px; }
.resultado::-webkit-scrollbar-thumb{ background:#222; border-radius:999px; }

/* CARD ETAPA COMPACTO */
.etapa-card{
  background: rgba(255,255,255,.03);
  border: 1px solid rgba(255,255,255,.06);
  border-radius:14px;
  padding:10px 14px;
  backdrop-filter: blur(10px);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.etapa-info-left{
  display:flex;
  flex-direction:column;
  gap:2px;
}

.etapa-num{
  font-size:11px;
  color:#777;
  text-transform:uppercase;
  letter-spacing:1px;
}

.etapa-comunidades{
  font-size:15px;
  font-weight:700;
  color:#fff;
}

.etapa-qualificacao{
  font-size:11px;
  color:#8c8c8c;
}

.etapa-valor{
  font-size:20px;
  font-weight:700;
  color:#00ff88;
  text-align:right;
}

/* MOBILE RESPONSIVO */
@media(max-width:640px){
  .card{ padding:12px; }
  .sim-grid{ grid-template-columns:1fr; gap:8px; }
  .etapa-card{ padding:8px 10px; }
  .etapa-comunidades{ font-size:13px; }
  .etapa-valor{ font-size:17px; }
}
</style>
</head>

<body>

<div class="app">
  <div class="overlay"></div>

  <div class="card mx-auto">
    <div class="eyebrow">
      Simulador CRC | Modelo de Comunidades
    </div>

    <h1 class="title">
      Simule a expansão da sua comunidade
    </h1>

    <p class="subtitle">
      Baseado na expansão de núcleos e no consumo recorrente do modelo CRC.
    </p>

    <div class="sim-grid" id="simGrid">
      <div>
        <label class="sim-label">
          gestores por comunidade
        </label>
        <select id="gestores" onchange="simular()" class="sim-select">
          <option value="3" selected>3 gestores</option>
          <option value="4">4 gestores</option>
          <option value="5">5 gestores</option>
          <option value="6">6 gestores</option>
          <option value="7">7 gestores</option>
          <option value="8">8 gestores</option>
          <option value="9">9 gestores</option>
          <option value="10">10 gestores</option>
        </select>
      </div>

      <div>
        <label class="sim-label">
          Consumo mínimo mensal da comunidade
        </label>
        <select id="consumo" onchange="simular()" class="sim-select">
          <option value="300" selected>R$ 300</option>
          <option value="350">R$ 350</option>
          <option value="400">R$ 400</option>
          <option value="450">R$ 450</option>
          <option value="500">R$ 500</option>
          <option value="550">R$ 550</option>
          <option value="600">R$ 600</option>
        </select>
      </div>
    </div>

    <div id="resultado" class="resultado"></div>
  </div>
</div>

<script>
function simular(){
  const gestoresPorComunidade = parseInt(document.getElementById('gestores').value);
  const consumo = parseInt(document.getElementById('consumo').value);

  const percentuais = [0.05, 0.05, 0.045, 0.04, 0.0275, 0.02, 0.005];

  const niveis = [
    { nome:'Empreendedor', pontos:950, pin:100 },
    { nome:'Senior', pontos:2450, pin:200 },
    { nome:'Expert', pontos:7250, pin:700 },
    { nome:'Enterprise', pontos:14750, pin:1300 },
    { nome:'Diamond', pontos:27500, pin:4000 },
    { nome:'Diamond Expert', pontos:60000, pin:12000 },
    { nome:'Diamond Global', pontos:122500, pin:24000 },
    { nome:'Empresarial Diamond', pontos:247500, pin:34000 },
    { nome:'Imperial Bonific', pontos:495000, pin:60000 },
    { nome:'Majestic Bonific', pontos:1475000, pin:130000 },
    { nome:'Presidencial', pontos:3000000, pin:250000 }
  ];

  let html = '';
  let camadas = [];
  let pessoasAtivas = 0;
  let saldoPontos = 0;
  let debitoMesSeguinte = 0;

  for(let etapa = 1; etapa <= 6; etapa++){
    saldoPontos -= debitoMesSeguinte;
    if(saldoPontos < 0) saldoPontos = 0;
    debitoMesSeguinte = 0;

    const novaCamadaPessoas = Math.pow(gestoresPorComunidade, etapa);
    camadas.push(novaCamadaPessoas);
    pessoasAtivas += novaCamadaPessoas;

    // Cálculo do número de comunidades (Pessoas Ativas / Gestores Por Comunidade)
    const numeroComunidades = pessoasAtivas / gestoresPorComunidade;

    const pontosMes = novaCamadaPessoas * (consumo / 300) * 100;

    let bonus30D = 0;
    if(etapa > 1){
      const pontosMesAnterior = camadas[etapa - 2] * (consumo / 300) * 100;
      if(pontosMes >= (pontosMesAnterior * 0.5)){
        bonus30D = pontosMesAnterior;
      }
    }

    saldoPontos += pontosMes + bonus30D;

    let bonusPin = 0;
    for(let nivel of niveis){
      if(saldoPontos >= nivel.pontos){
        bonusPin = nivel.pin;
        debitoMesSeguinte = nivel.pontos;
      }
    }

    let bonusUnilevel = 0;
    camadas.forEach((camada, index) => {
      if(percentuais[index]){
        bonusUnilevel += (camada * consumo) * percentuais[index];
      }
    });

    const bonusEstimado = bonusUnilevel + bonusPin;

    const nomeQualificacao = bonusPin > 0 
      ? (niveis.find(n => n.pin === bonusPin)?.nome || 'Em evolução') 
      : 'Em construção';

    html += `
    <div class="etapa-card">
      <div class="etapa-info-left">
        <span class="etapa-num">${etapa}ª Etapa</span>
        <span class="etapa-comunidades">${numeroComunidades.toLocaleString('pt-BR')} comunidades</span>
        <span class="etapa-qualificacao">Qualificação: <b style="color:#fff">${nomeQualificacao}</b></span>
      </div>
      <div class="etapa-valor">
        R$ ${bonusEstimado.toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}
      </div>
    </div>
    `;
  }

  document.getElementById('resultado').innerHTML = html;
}

simular();
</script>

</body>
</html>
